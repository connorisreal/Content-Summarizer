<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worth My Time?</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <main>
    <h1>Worth My Time?</h1>
    <p class="subtitle">Paste a YouTube link or article URL. Get the key points in seconds.</p>

    <div class="input-group">
      <input type="text" id="url-input" placeholder="https://..." />
      <button id="submit-btn">Check it</button>
    </div>
    
    <div id="error" class="error hidden"></div>

    <div id="result" class="result hidden">
      <h2>Here's what you need to know</h2>
      <ul id="bullets"></ul>
      <div class="verdict">
        <span id="verdict-text"></span>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
